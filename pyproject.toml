[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetrl"
version = "2.0.0"
description = "Fourteen warehouse fleet dispatch methods with reproducible training and evaluation"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "gymnasium>=1.2,<1.3", "stable-baselines3==2.7.0", "sb3-contrib==2.7.0", "torch>=2.3,<3", "ortools==9.14.6206", "matplotlib>=3.8,<4", "pygame>=2.5,<3", "tensorboard>=2.16,<3", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.4"]

[project.scripts]
fleetrl = "fleetrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: full engine or training integration", "slow: extended acceptance tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
